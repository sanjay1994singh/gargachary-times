{% extends 'dashboard_manage_base.html' %}

{% block content %}
<div class="panel-card">
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">News Category</label>
                <select name="news_category" class="form-select searchable-select" data-placeholder="Search category" required>
                    <option value="">Select Category</option>
                    {% for item in category %}
                        <option value="{{ item.id }}" {% if news_obj and news_obj.category_id == item.id %}selected{% endif %}>
                            {{ item.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Reporter</label>
                <select name="reporter" class="form-select searchable-select" data-placeholder="Search reporter">
                    <option value="">Gargachary Times</option>
                    {% for reporter in reporter_options %}
                        <option value="{{ reporter.name }}"
                                {% if news_obj and news_obj.reporter == reporter.name %}selected{% endif %}>
                            {{ reporter.name }}
                            {% if reporter.mobile %} - {{ reporter.mobile }}{% endif %}
                        </option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-12 mb-3">
                <label class="form-label fw-semibold">Title</label>
                <input type="text" name="title" class="form-control" value="{{ news_obj.title|default:'' }}" placeholder="Enter news title" required>
            </div>
            <div class="col-12 mb-3">
                <label class="form-label fw-semibold">News Text</label>
                <textarea name="news_text" id="news_text" class="form-control" rows="12" placeholder="Enter news text" required>{{ news_obj.text|default:'' }}</textarea>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Image</label>
                <input type="file" name="file_image" class="form-control">
            </div>
            {% if news_obj.featured_image %}
            <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Current Image</label><br>
                <img src="{{ news_obj.featured_image.url }}" class="thumb" alt="{{ news_obj.title }}">
            </div>
            {% endif %}
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary px-4">Save News</button>
            <a href="{% url 'dashboard_news_list' %}" class="btn btn-outline-light px-4">All News</a>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/ckeditor/ckeditor/ckeditor.js"></script>
<script>
    $(function () {
        $('.searchable-select').select2({
            width: '100%',
            allowClear: true,
            placeholder: function () {
                return $(this).data('placeholder');
            }
        });

        if (window.CKEDITOR) {
            const editor = CKEDITOR.replace('news_text', {
                height: 420,
                width: '100%',
                toolbar: 'Full'
            });

            editor.on('pluginsLoaded', function () {
                editor.addCommand('image', {
                    exec: function (activeEditor) {
                        const input = document.createElement('input');
                        input.type = 'file';
                        input.accept = 'image/*';
                        input.style.display = 'none';

                        input.addEventListener('change', function () {
                            const file = input.files && input.files[0];

                            if (!file) {
                                input.remove();
                                return;
                            }

                            const reader = new FileReader();

                            reader.onload = function (event) {
                                const image = activeEditor.document.createElement('img');
                                image.setAttribute('src', event.target.result);
                                image.setAttribute('alt', file.name);
                                image.setStyle('max-width', '100%');
                                image.setStyle('height', 'auto');
                                activeEditor.insertElement(image);
                                input.remove();
                            };

                            reader.readAsDataURL(file);
                        });

                        document.body.appendChild(input);
                        input.click();
                    }
                });
            });
        }

        document.querySelector('form').addEventListener('submit', function () {
            if (window.CKEDITOR && CKEDITOR.instances.news_text) {
                CKEDITOR.instances.news_text.updateElement();
            }
        });
    });
</script>
{% endblock %}
