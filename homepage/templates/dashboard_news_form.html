{% extends 'dashboard_manage_base.html' %}

{% block content %}
<div class="panel-card">
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">News Category</label>
                <select name="news_category" class="form-select" required>
                    <option value="">Select Category</option>
                    {% for item in category %}
                        <option value="{{ item.id }}" {% if news_obj and news_obj.category_id == item.id %}selected{% endif %}>
                            {{ item.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Reporter</label>
                <input type="text" name="reporter" class="form-control" value="{{ news_obj.reporter|default:'Gargachary Times' }}">
            </div>
            <div class="col-12 mb-3">
                <label class="form-label fw-semibold">Title</label>
                <input type="text" name="title" class="form-control" value="{{ news_obj.title|default:'' }}" placeholder="Enter news title" required>
            </div>
            <div class="col-12 mb-3">
                <label class="form-label fw-semibold">News Text</label>
                <textarea name="news_text" class="form-control" rows="12" placeholder="Enter news text" required>{{ news_obj.text|default:'' }}</textarea>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Image</label>
                <input type="file" name="file_image" class="form-control">
            </div>
            {% if news_obj.featured_image %}
            <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Current Image</label><br>
                <img src="{{ news_obj.featured_image.url }}" class="thumb" alt="{{ news_obj.title }}">
            </div>
            {% endif %}
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary px-4">Save News</button>
            <a href="{% url 'dashboard_news_list' %}" class="btn btn-outline-light px-4">All News</a>
        </div>
    </form>
</div>
{% endblock %}
